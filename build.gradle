plugins {
    id 'java'
}

group = 'myrobot'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(16)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation files('C:/robocode/libs/robocode.jar')
    implementation 'org.apache.commons:commons-math3:3.6.1' // example external library
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE // 👈 Prevents the error

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    from("src/main/resources") {
        into("/")
    }
}

