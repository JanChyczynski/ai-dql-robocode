plugins {
    id 'java'
}

group = 'mybot'
version = '1.0'

sourceCompatibility = '16'
targetCompatibility = '16'

repositories {
    mavenCentral()
    maven { url "https://oss.sonatype.org/content/repositories/releases" }
}

dependencies {
    // Robocode engine
    implementation files('C:/robocode/libs/robocode.jar')

    // Deeplearning4J + RL4J
    implementation "org.deeplearning4j:deeplearning4j-core:1.0.0-M1.1"
    implementation "org.nd4j:nd4j-native-platform:1.0.0-M1.1"
    implementation "org.deeplearning4j:rl4j-core:1.0.0-M1.1"

    // Logging
    implementation 'org.slf4j:slf4j-simple:1.7.30'

    // JAXB for Java 16+
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.1'

    // Lombok (required at runtime by DL4J classes)
    implementation 'org.projectlombok:lombok:1.18.32'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    from(sourceSets.main.resources)
}
