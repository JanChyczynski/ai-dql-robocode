plugins {
    id 'java'
}

group = 'myrobot'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(16)
    }
}

repositories {
    mavenCentral()

    // Add this to get RL4J and other DL4J modules
    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    maven { url "https://oss.sonatype.org/content/repositories/releases" }
}


def dl4jVersion = "1.0.0-beta7"

dependencies {
    implementation files('C:/robocode/libs/robocode.jar')

    implementation "org.deeplearning4j:deeplearning4j-core:$dl4jVersion"
    implementation "org.nd4j:nd4j-native-platform:$dl4jVersion"

    // ✅ RL4J (for reinforcement learning)
    implementation "org.deeplearning4j:rl4j-core:$dl4jVersion"

    // Logging
    implementation 'org.slf4j:slf4j-simple:1.7.30'

    // JAXB for Java 9+
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.1'

    // Lombok runtime classes
    implementation 'org.projectlombok:lombok:1.18.32'
}


jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    from(sourceSets.main.resources)
}
